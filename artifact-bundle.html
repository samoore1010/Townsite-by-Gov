  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

%{opacity:0;transform:scale(1.08)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<!-- DEMO BAR -->\n<div role=\"region\" aria-label=\"Demonstration controls\" style=\"background:#e8e4d8;border-bottom:1px solid #cdc7b6;color:#2a2a24\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:6px clamp(14px,3vw,28px);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px\">\n    <span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;padding:4px 6px;border:1px solid #2a2a24\">DEMO<\u002Fspan>\n    <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"flex:1 1 240px;min-width:0;font:400 13px/1.35 'Public Sans',sans-serif\">Fictional city, people, and project. Sample fees and time frames. <button sc-camel-on-click=\"{{ openAbout }}\" style=\"background:none;border:0;padding:0;font:600 13px 'Public Sans',sans-serif;color:#2a2a24;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">About<\u002Fbutton><\u002Fspan><\u002Fsc-if>\n    <label for=\"persona-select\" style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#2a2a24\">VIEWING AS<\u002Flabel>\n    <sc-raw-select id=\"persona-select\" ref=\"{{ personaRef }}\" value=\"{{ persona }}\" sc-camel-on-change=\"{{ onPersona }}\" style=\"font:600 13px 'Public Sans',sans-serif;padding:4px 26px 4px 8px;border:1px solid #2a2a24;border-radius:2px;background:#fff;color:#121c2b;cursor:pointer;max-width:100%\">\n      <option value=\"resident\">Resident · public, no sign-in<\u002Foption>\n      <option value=\"applicant\">Applicant · Dana Whitfield, Ridgeline Residential<\u002Foption>\n      <option value=\"planning\">Case manager · Alex Morgan, Planning<\u002Foption>\n      <option value=\"engineering\">Engineering reviewer · Taylor Chen<\u002Foption>\n      <option value=\"fire\">Fire reviewer · Casey Rivera<\u002Foption>\n      <option value=\"water\">Water utility reviewer · Sam Patel (partner)<\u002Foption>\n      <option value=\"leadership\">City leadership · Jordan Ellis, City Manager<\u002Foption>\n    <\u002Fsc-raw-select>\n    <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ tourToggle }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:5px 11px;background:#121c2b;color:#fff;border:1px solid #121c2b;border-radius:2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\" style-hover=\"background:#2c3a50\"><span aria-hidden=\"true\" style=\"width:0;height:0;border-left:7px solid #f2b631;border-top:5px solid transparent;border-bottom:5px solid transparent\"><\u002Fspan>{{ tourBtn }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ askReset }}\" style=\"background:none;border:1px solid #8a8473;border-radius:2px;padding:5px 10px;font:600 13px 'Public Sans',sans-serif;color:#2a2a24;cursor:pointer;white-space:nowrap\" style-hover=\"background:#ddd8c9\">Reset<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ ui.narrow }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openMenu }}\" aria-label=\"Menu\" style=\"margin-left:auto;width:36px;height:32px;background:#fff;border:1px solid #2a2a24;border-radius:2px;font:600 16px/1 'Public Sans',sans-serif;color:#2a2a24;cursor:pointer\">☰<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MASTHEAD -->\n<header style=\"background:#0b2545;color:#fff\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:10px clamp(14px,3vw,28px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px\">\n    <div style=\"display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ goHome }}\" aria-label=\"CivicPath home\" style=\"display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:#fff;cursor:pointer\"><span aria-hidden=\"true\" style=\"width:30px;height:30px;border:2px solid #fff;display:grid;place-items:center;font:700 12px/1 'IBM Plex Mono',monospace\">CP<\u002Fspan><span style=\"font:800 17px/1 'Public Sans',sans-serif;letter-spacing:.01em\">CivicPath<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"width:1px;height:24px;background:#3a5275\"><\u002Fspan>\n      <span style=\"font:500 13px/1.3 'Public Sans',sans-serif;color:#c3cfe0\">City of Cholla Ridge, Arizona <span style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#a9bad3\">· FICTIONAL<\u002Fspan><\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><nav aria-label=\"Primary\" style=\"display:flex;gap:2px;flex-wrap:wrap\">\n      <sc-for list=\"{{ gnav }}\" as=\"n\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"padding:8px 12px;background:{{ n.bg }};color:#fff;border:0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\" style-hover=\"background:#163d8f\">{{ n.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fnav><\u002Fsc-if>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><div role=\"status\" aria-live=\"polite\" style=\"font:500 12px 'Public Sans',sans-serif;color:#a9bad3\">{{ saveText }}<\u002Fdiv><\u002Fsc-if>\n      <span aria-hidden=\"true\" style=\"width:30px;height:30px;background:{{ me.abg }};color:#0b2545;display:grid;place-items:center;font:700 12px/1 'Public Sans',sans-serif\">{{ me.initials }}<\u002Fspan>\n      <sc-if value=\"{{ ui.full }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 14px/1 'Public Sans',sans-serif\">{{ me.person }}<\u002Fspan><span style=\"font:400 12px/1 'Public Sans',sans-serif;color:#c3cfe0\">{{ me.org }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\" style=\"flex:1;width:100%;display:flex;flex-direction:column;opacity:{{ fx.main.o }};transform:translateY({{ fx.main.y }});transition:{{ fx.main.t }}\">\n\n<!-- ===== PUBLIC HOME ===== -->\n<sc-if value=\"{{ is.pubHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Public home\" style=\"display:flex;flex-direction:column\">\n  <section style=\"background:#fff;border-bottom:1px solid #d6d3c8\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(14px,3vw,28px);display:flex;flex-direction:column;gap:22px\">\n      <h1 style=\"margin:0;font:800 clamp(28px,4vw,44px)/1.08 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.015em;text-wrap:balance;max-width:16ch\">Find a project or start your own<\u002Fh1>\n      <p style=\"margin:0;max-width:60ch;font:400 16px/1.55 'Public Sans',sans-serif;color:#3a4553;text-wrap:pretty\">Every development approval in Cholla Ridge, in one place and in order: who holds each step, what is blocking it, and what happens next.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ pub.onSearch }}\" role=\"search\" style=\"display:flex;gap:8px;flex-wrap:wrap;max-width:720px\">\n        <input type=\"search\" aria-label=\"Search address, parcel, or project number\" placeholder=\"Search address, parcel, or project number\" value=\"{{ pub.q }}\" sc-camel-on-change=\"{{ pub.onQ }}\" style=\"flex:1 1 260px;min-width:0;padding:13px 14px;border:1px solid #121c2b;border-radius:2px;font:400 16px 'Public Sans',sans-serif;background:#fff\">\n        <button type=\"submit\" style=\"padding:13px 20px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 15px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#163d8f\">Search<\u002Fbutton>\n      <\u002Fform>\n      <sc-if value=\"{{ pub.hasResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <ul data-tour=\"pub-results\" aria-label=\"Search results\" style=\"list-style:none;margin:0;padding:0;max-width:720px;border:1px solid #d6d3c8;background:#fff\">\n          <sc-for list=\"{{ pub.results }}\" as=\"r\" hint-placeholder-count=\"1\"><li><button sc-camel-on-click=\"{{ r.go }}\" style=\"width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;border-bottom:1px solid #e4e1d8;text-align:left;cursor:pointer;color:#121c2b\" style-hover=\"background:#f7f6f2\"><span style=\"display:flex;flex-direction:column;gap:3px\"><strong style=\"font:700 15px 'Public Sans',sans-serif\">{{ r.name }}<\u002Fstrong><span style=\"font:400 13px 'Public Sans',sans-serif;color:#5b6472\">{{ r.sub }}<\u002Fspan><\u002Fspan><span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472;white-space:nowrap\">{{ r.number }}<\u002Fspan><\u002Fbutton><\u002Fli><\u002Fsc-for>\n          <sc-if value=\"{{ pub.noResults }}\" hint-placeholder-val=\"{{ false }}\"><li style=\"padding:12px 14px;font:400 14px 'Public Sans',sans-serif;color:#5b6472\">No projects match. Try “Saguaro”, “1900 N. Ridge”, or “CR-2026-044”.<\u002Fli><\u002Fsc-if>\n        <\u002Ful>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ pub.goStart }}\" style=\"padding:11px 16px;background:#fff;color:#121c2b;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#f3f2ee\">Start a project →<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pub.goHearings }}\" style=\"padding:11px 16px;background:#fff;color:#121c2b;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#f3f2ee\">Hearings &amp; notices →<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pub.goGuides }}\" style=\"padding:11px 16px;background:#fff;color:#121c2b;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#f3f2ee\">How approval works →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div style=\"max-width:1120px;width:100%;margin:0 auto;padding:32px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:28px;align-items:start\">\n      <section aria-labelledby=\"near-h\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h2 id=\"near-h\" style=\"margin:0;font:800 19px/1.2 'Public Sans',sans-serif\">Projects near you<\u002Fh2><button sc-camel-on-click=\"{{ pub.goFind }}\" style=\"background:none;border:0;padding:0;color:#1d4fb8;font:600 13px 'Public Sans',sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Map and list<\u002Fbutton><\u002Fdiv>\n        <div style=\"position:relative;border:1px solid #d6d3c8;background:#f7f6f2;overflow:hidden\">{{ pub.cityMap }}<\u002Fdiv>\n        <p style=\"margin:0;font:400 11px/1.45 'Public Sans',sans-serif;color:#5b6472\">Illustrative map of a fictional city. Parcel lines are approximate (County Assessor GIS) and are not a survey. Not for construction. Public projects only; pre-application projects are not shown. Click a parcel to open its page.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px 'Public Sans',sans-serif;color:#3a4553\"><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#8aa3d6\"><\u002Fspan>Pre-app &amp; zoning<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#1d4fb8\"><\u002Fspan>Water &amp; site plan<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#b07a1e\"><\u002Fspan>Plat &amp; civil<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:#1b6a47\"><\u002Fspan>Building<\u002Fspan><\u002Fdiv>\n      <\u002Fsection>\n      <section aria-labelledby=\"hear-h\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h2 id=\"hear-h\" style=\"margin:0;font:800 19px/1.2 'Public Sans',sans-serif\">Upcoming public hearings<\u002Fh2><button sc-camel-on-click=\"{{ pub.goHearings }}\" style=\"background:none;border:0;padding:0;color:#1d4fb8;font:600 13px 'Public Sans',sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Full calendar<\u002Fbutton><\u002Fdiv>\n        <ol style=\"list-style:none;margin:0;padding:0;border-top:1px solid #d6d3c8\">\n          <sc-for list=\"{{ pub.hearings }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <li style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e4e1d8\">\n              <span style=\"display:flex;flex-direction:column;align-items:center;border:1px solid #121c2b;background:#fff\"><span style=\"width:100%;text-align:center;background:#0b2545;color:#fff;font:600 9px/1.6 'IBM Plex Mono',monospace\">{{ h.mon }}<\u002Fspan><span style=\"font:800 18px/1.3 'Public Sans',sans-serif\">{{ h.day }}<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><strong style=\"font:700 15px/1.3 'Public Sans',sans-serif\">{{ h.title }}<\u002Fstrong><span style=\"font:400 13px/1.4 'Public Sans',sans-serif;color:#5b6472\">{{ h.body }} · {{ h.time }} · {{ h.where }}<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <section aria-labelledby=\"how-h\" style=\"display:flex;flex-direction:column;gap:14px\">\n      <h2 id=\"how-h\" style=\"margin:0;font:800 19px/1.2 'Public Sans',sans-serif\">How development approval works<\u002Fh2>\n      <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px\">\n        <sc-for list=\"{{ pub.stages }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <li><button sc-camel-on-click=\"{{ s.go }}\" style=\"width:100%;height:100%;text-align:left;padding:12px 12px 14px;background:#fff;border:1px solid #d6d3c8;border-top:4px solid #0b2545;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#121c2b\" style-hover=\"border-color:#0b2545\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">STAGE {{ s.n }}<\u002Fspan><strong style=\"font:700 15px/1.25 'Public Sans',sans-serif\">{{ s.name }}<\u002Fstrong><span style=\"font:400 13px/1.4 'Public Sans',sans-serif;color:#3a4553;text-wrap:pretty\">{{ s.line }}<\u002Fspan><\u002Fbutton><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== FIND PROJECTS ===== -->\n<sc-if value=\"{{ is.pubFind }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Find projects\" style=\"max-width:1120px;width:100%;margin:0 auto;padding:28px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:800 30px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Find projects<\u002Fh1><span style=\"font:400 15px/1.45 'Public Sans',sans-serif;color:#3a4553\">Active development projects in Cholla Ridge. Sample data.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"position:relative;border:1px solid #d6d3c8;background:#f7f6f2;overflow:hidden\">{{ pub.cityMap }}<\u002Fdiv>\n        <p style=\"margin:0;font:400 11px/1.45 'Public Sans',sans-serif;color:#5b6472\">Illustrative map of a fictional city. Parcel lines are approximate (County Assessor GIS) and are not a survey. Not for construction. Public projects only; pre-application projects are not shown. Click a parcel to open its page.<\u002Fp><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px 'Public Sans',sans-serif;color:#3a4553\"><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#8aa3d6\"><\u002Fspan>Pre-app &amp; zoning<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#1d4fb8\"><\u002Fspan>Water &amp; site plan<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#b07a1e\"><\u002Fspan>Plat &amp; civil<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:#1b6a47\"><\u002Fspan>Building<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <ol style=\"list-style:none;margin:0;padding:0;background:#fff;border:1px solid #d6d3c8\">\n      <sc-for list=\"{{ pub.list }}\" as=\"r\" hint-placeholder-count=\"6\"><li><button sc-camel-on-click=\"{{ r.go }}\" style=\"width:100%;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;background:none;border:0;border-bottom:1px solid #e4e1d8;text-align:left;cursor:pointer;color:#121c2b\" style-hover=\"background:#f7f6f2\"><span aria-hidden=\"true\" style=\"grid-row:1/3;width:72px;height:50px;border:1px solid #d6d3c8;overflow:hidden;background:#f7f6f2\">{{ r.thumb }}<\u002Fspan><strong style=\"font:700 15px 'Public Sans',sans-serif\">{{ r.name }}<\u002Fstrong><span style=\"display:inline-flex;align-items:center;gap:6px;padding:2px 7px;font:600 12px/18px 'Public Sans',sans-serif;white-space:nowrap;color:{{ r.st.fg }};background:{{ r.st.bg }};border:1px solid {{ r.st.bd }}\"><span style=\"width:7px;height:7px;background:{{ r.st.fg }}\"><\u002Fspan>{{ r.st.label }}<\u002Fspan><span style=\"font:400 13px 'Public Sans',sans-serif;color:#5b6472;grid-column:2/-1\">{{ r.sub }}<\u002Fspan><\u002Fbutton><\u002Fli><\u002Fsc-for>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== HEARINGS & NOTICES ===== -->\n<sc-if value=\"{{ is.hearings }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Hearings and notices\" style=\"max-width:1120px;width:100%;margin:0 auto;padding:28px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:800 30px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Hearings &amp; notices<\u002Fh1><span style=\"font:400 15px/1.45 'Public Sans',sans-serif;color:#3a4553;text-wrap:pretty\">Planning &amp; Zoning Commission and City Council hearings on development items. Notice is published, mailed to owners within 300 ft, and posted on site at least 15 days before each hearing.<\u002Fspan><\u002Fdiv>\n  <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px\">\n    <sc-for list=\"{{ hearingCards }}\" as=\"h\" hint-placeholder-count=\"3\">\n      <li style=\"display:grid;grid-template-columns:76px minmax(0,1fr);background:#fff;border:1px solid #d6d3c8\">\n        <div style=\"border-right:1px solid #d6d3c8;display:flex;flex-direction:column;align-items:center;text-align:center\"><span style=\"width:100%;padding:5px 0;background:#0b2545;color:#fff;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em\">{{ h.mon }}<\u002Fspan><span style=\"font:800 28px/1.1 'Public Sans',sans-serif;color:#0b2545;padding-top:8px\">{{ h.day }}<\u002Fspan><span style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472;padding-bottom:8px\">{{ h.dow }}<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px\"><strong style=\"font:700 16px/1.3 'Public Sans',sans-serif\">{{ h.body }} · {{ h.time }}<\u002Fstrong><span style=\"font:400 13px 'Public Sans',sans-serif;color:#5b6472\">{{ h.where }}<\u002Fspan><\u002Fdiv>\n          <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px\">\n            <sc-for list=\"{{ h.items }}\" as=\"i\" hint-placeholder-count=\"1\"><li style=\"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font:400 14px/1.45 'Public Sans',sans-serif\"><span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">ITEM {{ i.n }}<\u002Fspan><sc-if value=\"{{ i.hasLink }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ i.go }}\" style=\"background:none;border:0;padding:0;font:600 14px 'Public Sans',sans-serif;color:#1d4fb8;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left\">{{ i.title }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ i.noLink }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-weight:600\">{{ i.title }}<\u002Fspan><\u002Fsc-if><span style=\"color:#3a4553\">{{ i.detail }}<\u002Fspan><sc-if value=\"{{ i.tentative }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:3px 5px;border:1px solid #e5cf8e;background:#fbf2d8;color:#7a5200\">TENTATIVE<\u002Fspan><\u002Fsc-if><\u002Fli><\u002Fsc-for>\n          <\u002Fol>\n          <span style=\"font:400 13px/1.45 'Public Sans',sans-serif;color:#3a4553\">Attend in person or by video; speak during public comment or submit written comment to the City Clerk before noon the day of the hearing.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== START A PROJECT ===== -->\n<sc-if value=\"{{ is.start }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Start a project\" style=\"max-width:1120px;width:100%;margin:0 auto;padding:28px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:800 30px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Start a project<\u002Fh1><span style=\"font:400 15px/1.45 'Public Sans',sans-serif;color:#3a4553\">Three questions produce a preliminary path: the approvals that apply, in order, with holders, sample fees, published time frames, and gates.<\u002Fspan><\u002Fdiv>\n  <ol aria-label=\"Steps\" style=\"list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap\">\n    <sc-for list=\"{{ st.steps }}\" as=\"s\" hint-placeholder-count=\"4\"><li style=\"display:flex;align-items:center;gap:8px;padding:6px 10px;background:{{ s.bg }};color:{{ s.fg }};border:1px solid #121c2b;font:600 13px 'Public Sans',sans-serif\"><span style=\"font:600 11px 'IBM Plex Mono',monospace\">{{ s.n }}<\u002Fspan>{{ s.label }}<\u002Fli><\u002Fsc-for>\n  <\u002Fol>\n  <sc-if value=\"{{ st.isAddress }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"background:#fff;border:1px solid #d6d3c8;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:720px\">\n      <label for=\"st-address\" style=\"font:700 16px 'Public Sans',sans-serif\">Where is the property?<\u002Flabel>\n      <input id=\"st-address\" type=\"text\" value=\"{{ st.address }}\" sc-camel-on-change=\"{{ st.onAddress }}\" placeholder=\"Address or parcel number\" style=\"padding:12px 14px;border:1px solid #8f96a0;border-radius:2px;font:400 15px 'Public Sans',sans-serif\">\n      <span style=\"font:400 13px/1.45 'Public Sans',sans-serif;color:#5b6472\">We look up the General Plan designation, zoning, and whether the parcel is inside the Active Management Area. Sample lookup.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ st.next }}\" style=\"align-self:flex-start;padding:11px 18px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer\">Continue →<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ st.isBuild }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"background:#fff;border:1px solid #d6d3c8;padding:22px;display:flex;flex-direction:column;gap:18px;max-width:720px\">\n      <strong style=\"font:700 16px 'Public Sans',sans-serif\">What do you want to build?<\u002Fstrong>\n      <div role=\"group\" aria-label=\"Project type\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">TYPE<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ st.types }}\" as=\"t\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"padding:8px 12px;background:{{ t.bg }};color:{{ t.fg }};border:1px solid #121c2b;border-radius:2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div role=\"group\" aria-label=\"Tenure\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">FOR SALE OR RENTAL<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ st.tenures }}\" as=\"t\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"padding:8px 12px;background:{{ t.bg }};color:{{ t.fg }};border:1px solid #121c2b;border-radius:2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font:600 13px 'Public Sans',sans-serif\">Units or lots<input type=\"number\" min=\"1\" value=\"{{ st.units }}\" sc-camel-on-change=\"{{ st.onUnits }}\" style=\"padding:10px 12px;border:1px solid #8f96a0;border-radius:2px;font:400 15px 'Public Sans',sans-serif\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font:600 13px 'Public Sans',sans-serif\">Acreage<input type=\"number\" min=\"0.1\" step=\"0.1\" value=\"{{ st.acres }}\" sc-camel-on-change=\"{{ st.onAcres }}\" style=\"padding:10px 12px;border:1px solid #8f96a0;border-radius:2px;font:400 15px 'Public Sans',sans-serif\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px\"><button sc-camel-on-click=\"{{ st.back }}\" style=\"padding:11px 16px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">← Back<\u002Fbutton><button sc-camel-on-click=\"{{ st.next }}\" style=\"padding:11px 18px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer\">Continue →<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ st.isExisting }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"background:#fff;border:1px solid #d6d3c8;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:720px\">\n      <strong style=\"font:700 16px 'Public Sans',sans-serif\">Approvals you already know of<\u002Fstrong>\n      <span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#3a4553\">Tick anything already in place. The city confirms what still counts at the pre-application meeting.<\u002Fspan>\n      <div style=\"border:1px solid #d6d3c8\"><sc-for list=\"{{ st.existing }}\" as=\"e\" hint-placeholder-count=\"4\"><label style=\"display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #e4e1d8;cursor:pointer;font:400 14px/1.4 'Public Sans',sans-serif\"><input type=\"checkbox\" checked=\"{{ e.on }}\" sc-camel-on-change=\"{{ e.toggle }}\" style=\"margin-top:2px;width:16px;height:16px\"><span><strong style=\"font-weight:600\">{{ e.label }}<\u002Fstrong> <span style=\"color:#5b6472\">· {{ e.sub }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for><\u002Fdiv>\n      <div style=\"display:flex;gap:10px\"><button sc-camel-on-click=\"{{ st.back }}\" style=\"padding:11px 16px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">← Back<\u002Fbutton><button sc-camel-on-click=\"{{ st.next }}\" style=\"padding:11px 18px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer\">Generate path →<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ st.isPath }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"padding:16px 18px;background:#fbf2d8;border:1px solid #e5cf8e;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#7a5200\">PRELIMINARY · CONFIRMED AT PRE-APPLICATION<\u002Fspan><strong style=\"font:700 17px/1.3 'Public Sans',sans-serif\">{{ st.summary }}<\u002Fstrong><span style=\"font:400 13px 'Public Sans',sans-serif;color:#5c3e00\">{{ st.count }} approvals · about {{ st.feeTotal }} in sample city fees · {{ st.gateCount }} hard gates<\u002Fspan><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ st.requestPre }}\" style=\"padding:11px 18px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer\">Request a pre-application meeting<\u002Fbutton>\n      <\u002Fdiv>\n      <ol style=\"list-style:none;margin:0;padding:0;background:#fff;border:1px solid #d6d3c8\">\n        <sc-for list=\"{{ st.path }}\" as=\"p\" hint-placeholder-count=\"8\">\n          <li style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;border-bottom:1px solid #e4e1d8;background:{{ p.bg }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#5b6472\">STAGE {{ p.stage }}<\u002Fspan><strong style=\"font:700 15px/1.3 'Public Sans',sans-serif\">{{ p.title }}<\u002Fstrong><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:3px 5px;background:{{ p.tier.bg }};color:{{ p.tier.fg }};border:1px solid {{ p.tier.bd }}\">{{ p.tier.label }}<\u002Fspan><\u002Fdiv>\n            <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:#3a4553;white-space:nowrap\">{{ p.fee }}<\u002Fspan>\n            <span style=\"font:400 13px/1.45 'Public Sans',sans-serif;color:#3a4553;grid-column:1/-1;text-wrap:pretty\">{{ p.holder }} · {{ p.frame }}<sc-if value=\"{{ p.hasGate }}\" hint-placeholder-val=\"{{ false }}\"> · <span style=\"color:#7a5200;font-weight:600\">Gate: {{ p.gate }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <button sc-camel-on-click=\"{{ st.back }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;color:#1d4fb8;font:600 14px 'Public Sans',sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">← Change answers<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== GUIDES ===== -->\n<sc-if value=\"{{ is.guides }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Guides\" style=\"max-width:1120px;width:100%;margin:0 auto;padding:28px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:800 30px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">How development approval works<\u002Fh1><span style=\"font:400 15px/1.45 'Public Sans',sans-serif;color:#3a4553;text-wrap:pretty\">Eight stages from first inquiry to certificate of occupancy. Stages overlap in practice; the gates between them do not.<\u002Fspan><\u002Fdiv>\n  <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px\">\n    <sc-for list=\"{{ guideStages }}\" as=\"g\" hint-placeholder-count=\"8\">\n      <li style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:18px 20px;background:#fff;border:1px solid #d6d3c8;border-left:0;border-top:4px solid #0b2545\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">STAGE {{ g.n }}<\u002Fspan><h2 style=\"margin:0;font:800 19px/1.2 'Public Sans',sans-serif\">{{ g.name }}<\u002Fh2><span style=\"font:400 13px 'Public Sans',sans-serif;color:#5b6472\">Ends when: {{ g.ends }}<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font:400 15px/1.55 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty;max-width:72ch\">{{ g.plain }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ g.terms }}\" as=\"t\" hint-placeholder-count=\"2\"><span title=\"{{ t.def }}\" style=\"padding:4px 8px;border:1px solid #cfccc2;background:#f7f6f2;font:500 12px 'Public Sans',sans-serif;color:#26313f;cursor:help\">{{ t.term }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== PUBLIC PROJECT PAGE ===== -->\n<sc-if value=\"{{ is.pubProject }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Public project page\" style=\"max-width:960px;width:100%;margin:0 auto;padding:24px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:24px\">\n  <nav aria-label=\"Breadcrumb\" style=\"font:500 13px 'Public Sans',sans-serif;color:#5b6472\"><button sc-camel-on-click=\"{{ pub.goFind }}\" style=\"background:none;border:0;padding:0;color:#1d4fb8;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Find projects<\u002Fbutton> › {{ pp.name }}<\u002Fnav>\n  <div style=\"display:grid;grid-template-columns:{{ rp.cols }};gap:28px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;min-width:0\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <h1 style=\"margin:0;font:800 clamp(26px,3vw,32px)/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.015em\">{{ pp.name }}<\u002Fh1>\n        <p style=\"margin:0;font:400 16px/1.55 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">{{ pp.summary }}<\u002Fp>\n        <p data-tour=\"pub-stage\" style=\"margin:0;font:500 16px/1.5 'Public Sans',sans-serif;color:#121c2b;text-wrap:pretty\">{{ rp.sentence }}<\u002Fp>\n        <div style=\"background:#fff;border:1px solid #d6d3c8;margin-top:6px\"><div style=\"height:{{ pmap.h }};overflow:hidden\">{{ pmap.el }}<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 12px;border-top:1px solid #e4e1d8;font:400 12px/1.45 'Public Sans',sans-serif;color:#5b6472\"><sc-for list=\"{{ pmap.alt }}\" as=\"a\" hint-placeholder-count=\"3\"><span>{{ a }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><p style=\"margin:0;padding:0 12px 8px;font:400 11px/1.45 'Public Sans',sans-serif;color:#5b6472\">{{ pp.address }}. Illustrative map of a fictional city; parcel lines approximate (County Assessor GIS), not a survey. Plans under review are not shown.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center\"><ol aria-hidden=\"true\" style=\"list-style:none;margin:0;padding:0;display:flex;gap:3px\"><sc-for list=\"{{ rp.journey.dots }}\" as=\"s\" hint-placeholder-count=\"8\"><li title=\"{{ s.name }}\" style=\"width:22px;height:6px;background:{{ s.bg }};border:1px solid {{ s.bd }}\"><\u002Fli><\u002Fsc-for><\u002Fol><span style=\"font:500 13px 'Public Sans',sans-serif;color:#3a4553\">{{ rp.journey.label }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <section aria-labelledby=\"rh-h\" style=\"display:flex;flex-direction:column;gap:8px\">\n        <h2 id=\"rh-h\" style=\"margin:0;font:700 17px/1.25 'Public Sans',sans-serif;color:#0b2545\">Public hearings and comment<\u002Fh2>\n        <sc-if value=\"{{ pp.noHearings }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:14px 16px;background:#fff;border:1px solid #d6d3c8;font:400 14px/1.55 'Public Sans',sans-serif;color:#26313f\">{{ rp.sayText }}<\u002Fp><\u002Fsc-if>\n        <sc-for list=\"{{ pp.hearings }}\" as=\"h\" hint-placeholder-count=\"1\"><div style=\"padding:14px 16px;background:#fff;border:1px solid #d6d3c8;display:flex;flex-direction:column;gap:4px\"><strong style=\"font:600 15px 'Public Sans',sans-serif\">{{ h.body }} · {{ h.date }}<\u002Fstrong><span style=\"font:400 14px/1.5 'Public Sans',sans-serif;color:#26313f\">{{ h.title }} · {{ h.time }} · {{ h.where }}. Public comment is taken at the hearing; written comments may be filed with the case manager before the hearing date (A.R.S. § 9-462.04).<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fsection>\n      <section aria-labelledby=\"rd-h\" style=\"display:flex;flex-direction:column;gap:8px\">\n        <h2 id=\"rd-h\" style=\"margin:0;font:700 17px/1.25 'Public Sans',sans-serif;color:#0b2545\">Decisions of record<\u002Fh2>\n        <ol style=\"list-style:none;margin:0;padding:0;background:#fff;border:1px solid #d6d3c8\"><sc-for list=\"{{ pp.decisions }}\" as=\"x\" hint-placeholder-count=\"3\"><li style=\"display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-bottom:1px solid #e4e1d8\"><strong style=\"font:600 14px 'Public Sans',sans-serif\">{{ x.title }}<\u002Fstrong><span style=\"font:400 13px/1.45 'Public 26px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:800 28px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Performance against published time frames<\u002Fh1><span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#5b6472\">{{ dash.asOf }}<\u002Fspan><\u002Fdiv>\n  <ol data-tour=\"metrics\" aria-label=\"Measures\" style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px\">\n    <sc-for list=\"{{ d7.measures }}\" as=\"m\" hint-placeholder-count=\"4\"><li style=\"background:#fff;border:1px solid #d6d3c8;border-top:4px solid {{ m.bar }};padding:14px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 13px/1.3 'Public Sans',sans-serif;color:#3a4553\">{{ m.label }}<\u002Fspan><strong style=\"font:800 30px/1 'Public Sans',sans-serif;color:{{ m.fg }}\">{{ m.value }}<\u002Fstrong><span style=\"font:400 12px/1.4 'Public Sans',sans-serif;color:#5b6472\">{{ m.sub }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n  <\u002Fol>\n  <section aria-labelledby=\"ex-h\" style=\"display:flex;flex-direction:column;gap:4px\">\n    <h2 id=\"ex-h\" style=\"margin:0;padding-bottom:8px;border-bottom:2px solid #0b2545;font:700 17px/1.25 'Public Sans',sans-serif;color:#0b2545\">Applications outside statutory or code limits<\u002Fh2>\n    <ol data-tour=\"stalled\" style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ d7.exceptions }}\" as=\"x\" hint-placeholder-count=\"5\"><li style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;align-items:center;padding:11px 0;border-bottom:1px solid #e4e1d8\"><sc-if value=\"{{ x.canOpen }}\" hint-placeholder-val=\"{{ true }}\"><button data-tour=\"{{ x.tour }}\" sc-camel-on-click=\"{{ x.go }}\" style=\"background:none;border:0;padding:0;text-align:left;font:600 15px/1.35 'Public Sans',sans-serif;color:#121c2b;cursor:pointer\" style-hover=\"text-decoration:underline;text-unde k line marks the published time frame. Sample data.<\u002Fspan>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<!-- ===== SAMPLE PROJECT SUMMARY ===== -->\n<sc-if value=\"{{ is.sample }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Sample project summary\" style=\"max-width:1120px;width:100%;margin:0 auto;padding:24px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:20px\">\n  <nav aria-label=\"Breadcrumb\" style=\"display:flex;flex-wrap:wrap;gap:6px;font:500 13px 'Public Sans',sans-serif;color:#5b6472\"><button sc-camel-on-click=\"{{ sp.back }}\" style=\"background:none;border:0;padding:0;color:#1d4fb8;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ sp.backLabel }}<\u002Fbutton><span aria-hidden=\"true\">›<\u002Fspan><span>{{ sp.name }}<\u002Fspan><\u002Fnav>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">{{ sp.number }} · {{ sp.address }}<\u002Fspan><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:3px 5px;border:1px solid #cfccc2;background:#f7f6f2;color:#4a5260;white-space:nowrap\">SAMPLE PROJECT · SUMMARY ONLY<\u002Fspan><\u002Fdiv>\n    <h1 style=\"margin:0;font:800 clamp(26px,3vw,34px)/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.015em\">{{ sp.name }}<\u002Fh1>\n    <span style=\"font:400 15px/1.5 'Public Sans',sans-serif;color:#26313f\">{{ sp.item }}<\u002Fspan>\n  <\u002Fdiv>\n  <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 22px;padding:14px 18px;background:#fff;border:1px solid #d6d3c8;font:400 13px/1.4 'Public Sans',sans-serif\">\n    <div style=\"display:flex;flex-direction:column;gap:3px\"><dt style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">STAGE 0 12px/1.5 'Public Sans',sans-serif;color:#5b6472;max-width:80ch\">Read-only sample from the demonstration registry. The full workspace is built out for Saguaro Commons and Ironwood Pad only.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== PROJECT WORKSPACE ===== -->\n<sc-if value=\"{{ is.ws }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1400px;width:100%;margin:0 auto;padding:16px clamp(14px,3vw,28px) 48px;display:flex;flex-direction:column;gap:18px\">\n  <nav aria-label=\"Breadcrumb\" style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 13px 'Public Sans',sans-serif;color:#5b6472\">\n    <sc-for list=\"{{ crumbs }}\" as=\"c\" hint-placeholder-count=\"3\"><sc-if value=\"{{ c.hasGo }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ c.go }}\" style=\"background:none;border:0;padding:0;color:#1d4fb8;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ c.label }}<\u002Fbutton><span aria-hidden=\"true\">›<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ c.isLast }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#121c2b;font-weight:600\">{{ c.label }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for>\n  <\u002Fnav>\n\n  <!-- PROJECT HEADER -->\n  <header data-tour=\"project-header\" style=\"background:#fff;border:1px solid #d6d3c8;padding:18px 20px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline\">\n      <h1 style=\"margin:0;font:800 clamp(22px,2.6vw,28px)/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">{{ ph.name }}<\u002Fh1>\n      <span style=\"font:500 13px/1.4 'Public Sans',sans-serif;color:#5b6472\">{{ ph.address }}<\u002Fspan>\n    <\u002Fdiv>\n    <p data-tour=\"status-sentence\" style=\"margin:0;max-width:72ch;font:500 17px/1.45 'Public Sans',sans-serif;color:#121c2b;text-wrap:pretty\">{{ ph.sentence }}<\u002Fp>\n    <div data-tour=\"spine\" style= ckground:{{ i.st.fg }}\"><\u002Fspan>{{ i.st.label }}<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:0;font:400 14px/1.5 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">{{ i.body }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;font:400 13px 'Public Sans',sans-serif;color:#3a4553\"><span>Owner: <strong>{{ i.owner }}<\u002Fstrong><\u002Fspan><span>Participating: <strong>{{ i.parts }}<\u002Fstrong><\u002Fspan><span>Comments: <sc-for list=\"{{ i.refs }}\" as=\"r\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ r.open }}\" style=\"background:none;border:0;padding:0 4px 0 0;font:600 13px 'IBM Plex Mono',monospace;color:#1d4fb8;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ r.label }}<\u002Fbutton><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ co.hiddenIssue }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:12px 14px;background:#e7eefb;border:1px solid #b4c7ef;font:400 14px/1.45 'Public Sans',sans-serif;color:#13336f\">CO-01 involves Engineering and Fire. Detail is held by those disciplines; shared status only in this view.<\u002Fp><\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- SCHEDULE -->\n    <sc-if value=\"{{ is.schedule }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Schedule\" style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><h2 style=\"margin:0;font:800 26px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Schedule<\u002Fh2><span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#3a4553\">Meetings, hearings, deadlines, and review clocks for this project.<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ sc.hasOptions }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex;flex-direction:column\">\n        <div style=\"d ><\u002Fsc-if><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fsection>\n      <p style=\"margin:0;max-width:820px;font:400 12px/1.5 'Public Sans',sans-serif;color:#5b6472;text-wrap:pretty\">Carries forward: valid as approved · Renew: renew the expired approval · Amend: amend the prior approval · Replace: a new approval replaces the prior one · New requirement: first required by the current application · Not applicable · Assessment pending: staff have not yet assessed. Formal determinations (ZIN-34) are separate requirements with an appeal path.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- TEAM CHECKLIST (applicant, private) -->\n    <sc-if value=\"{{ is.team }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Team checklist\" style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\"><h2 style=\"margin:0;font:800 26px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Team checklist<\u002Fh2><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:4px 6px;border:1px solid #cfccc2;background:#f7f6f2;color:#4a5260\">PRIVATE<\u002Fspan><\u002Fdiv><span style=\"font:400 15px/1.5 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">Private to your team. The city cannot see this checklist. Track your own due diligence, consultants, and budget lines here, and link each item to the city requirement it serves.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;align-items:start\">\n        <sc-for list=\"{{ tm.groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <section style=\"background:#fff;border:1px solid #d6d3c8;display:flex;flex-direction:column\">\n          <h3 style=\"margin:0;padding:12px 16px;border-bottom:1px solid #e4e1d8;font:700 15px 'Public Sans',sans-serif\">{{ g.label }}<\u002Fh3>\n          <ol style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\"><li style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:10px 16px;border-bottom:1px solid #e4e1d8\"><sc-if value=\"{{ i.checkable }}\" hint-placeholder-val=\"{{ true }}\"><input type=\"checkbox\" aria-label=\"Done\" checked=\"{{ i.done }}\" sc-camel-on-change=\"{{ i.toggle }}\" style=\"margin-top:3px;width:16px;height:16px\"><\u002Fsc-if><sc-if value=\"{{ i.plain }}\" hint-placeholder-val=\"{{ false }}\"><span aria-hidden=\"true\" style=\"width:6px;height:6px;margin:7px 0 0 5px;background:#8f96a0\"><\u002Fspan><\u002Fsc-if><span style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"font:600 14px/1.4 'Public Sans',sans-serif;color:{{ i.fg }};text-decoration:{{ i.deco }}\">{{ i.label }}<\u002Fspan><span style=\"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:400 13px/1.4 'Public Sans',sans-serif;color:#5b6472\"><sc-if value=\"{{ i.hasSub }}\" hint-placeholder-val=\"{{ false }}\"><span>{{ i.sub }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ i.hasLink }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ i.openLink }}\" style=\"background:none;border:0;padding:0;font:600 12px 'IBM Plex Mono',monospace;color:#1d4fb8;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Needed for {{ i.linked }}<\u002Fbutton><\u002Fsc-if><\u002Fspan><\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol>\n        <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <form sc-camel-on-submit=\"{{ tm.add }}\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;background:#fff;border:1px solid #d6d3c8\">\n        <label for=\"team-new\" style=\"font:700 14px 'Public Sans',sans-serif\">Add an item<\u002Flabel>\n        <input id=\"team-new\" type=\"text\" value=\"{{ tm.newLabel }}\" sc-camel-on-change=\"{{ tm.onNewLabel }}\" placeholder=\"e.g. Lender appraisal\" style=\"flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid #8f96a0;border-radius:2px;font:400 14px 'Public Sans',sans-serif\">\n        <sc-raw-select aria-label=\"Link to a city requirement\" value=\"{{ tm.newLink }}\" sc-camel-on-change=\"{{ tm.onNewLink }}\" style=\"font:600 13px 'Public Sans',sans-serif;padding:9px 26px 9px 8px;border:1px solid #8f96a0;border-radius:2px;background:#fff\"><sc-for list=\"{{ tm.linkOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <button type=\"submit\" style=\"padding:9px 14px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Add<\u002Fbutton>\n      <\u002Fform>\n      <p style=\"margin:0;max-width:820px;font:400 12px/1.5 'Public Sans',sans-serif;color:#5b6472;text-wrap:pretty\">Stored with your team’s account only. Nothing here appears in any staff, partner, leadership, or public view, and the city makes no determination about it. Sample content.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- PUBLIC PAGE PREVIEW -->\n    <sc-if value=\"{{ is.publicPreview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Public page preview\" style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end\"><div style=\"display:flex;flex-direction:column;gap:6px\"><h2 style=\"margin:0;font:800 26px/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em\">Public page<\u002Fh2><span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#3a4553\">A true preview of what residents see.<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ pp.openAsResident }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#f3f2ee\">View as a resident →<\u002Fbutton><\u002Fdiv>\n      <section style=\"background:#fff;border:1px solid #d6d3c8;padding:22px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">{{ pp.number }} · {{ pp.address }}<\u002Fspan><strong style=\"font:800 24px/1.1 'Public Sans',sans-serif;color:#0b2545\">{{ pp.name }}<\u002Fstrong><p style=\"margin:0;max-width:66ch;font:400 15px/1.55 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">{{ pp.summary }}<\u002Fp><\u002Fdiv>\n        <ol aria-label=\"Stages\" style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:520px\"><sc-for list=\"{{ pp.spine }}\" as=\"s\" hint-placeholder-count=\"8\"><li title=\"{{ s.name }}\" style=\"height:8px;background:{{ s.bg }};border:1px solid {{ s.bd }}\"><\u002Fli><\u002Fsc-for><\u002Fol>\n        <strong style=\"font:700 16px/1.3 'Public Sans',sans-serif\">{{ pp.stageLine }}<\u002Fstrong>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">HEARINGS<\u002Fspan><sc-if value=\"{{ pp.noHearings }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:400 14px 'Public Sans',sans-serif;color:#3a4553\">None scheduled; administrative review.<\u002Fspan><\u002Fsc-if><sc-for list=\"{{ pp.hearings }}\" as=\"h\" hint-placeholder-count=\"1\"><span style=\"font:400 14px/1.4 'Public Sans',sans-serif\">{{ h.date }} · {{ h.body }} · {{ h.title }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">PUBLIC DOCUMENTS<\u002Fspan><sc-for list=\"{{ pp.docs }}\" as=\"x\" hint-placeholder-count=\"3\"><span style=\"font:400 14px/1.4 'Public Sans',sans-serif\">{{ x.title }} <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">{{ x.date }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">APPROVALS ON THIS PARCEL<\u002Fspan><sc-for list=\"{{ pp.decisions }}\" as=\"x\" hint-placeholder-count=\"2\"><span style=\"font:400 14px/1.4 'Public Sans',sans-serif\">{{ x.title }} · {{ x.outcome }} <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">{{ x.date }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <p style=\"margin:0;padding:12px 14px;background:#f1eee5;border:1px solid #cdc7b6;font:400 13px/1.5 'Public Sans',sans-serif;color:#3a4553;text-wrap:pretty\"><strong>Not shown to residents:<\u002Fstrong> {{ pp.hiddenNote }}<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== APPROVAL PAGE ===== -->\n    <sc-if value=\"{{ is.approval }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Decision\" style=\"display:flex;flex-direction:column;gap:16px\">\n      <header data-tour=\"approval-header\" style=\"background:#fff;border:1px solid #d6d3c8;padding:20px;display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:800 clamp(22px,2.6vw,28px)/1.1 'Public Sans',sans-serif;color:#0b2545;letter-spacing:-.01em;text-wrap:balance\">{{ ap.title }}<\u002Fh2>\n        <p style=\"margin:0;max-width:72ch;font:400 15px/1.5 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">{{ dp.sentence }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:center;padding-top:12px;border-top:1px solid #e4e1d8\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center\"><span style=\"display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font:600 12px/18px 'Public Sans',sans-serif;white-space:nowrap;color:{{ dp.st.fg }};background:{{ dp.st.bg }};border:1px solid {{ dp.st.bd }}\">{{ dp.st.label }}<\u002Fspan><span style=\"font:600 14px/1.4 'Public Sans',sans-serif;color:{{ dp.whoFg }}\">{{ dp.whoLabel }}<\u002Fspan><span style=\"font:400 14px/1.4 'Public Sans',sans-serif;color:#3a4553\">{{ dp.line }}<\u002Fspan><span style=\"font:400 12px 'IBM Plex Mono',monospace;color:#8f96a0\">{{ dp.auth }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ dp.hasPrimary }}\" hint-placeholder-val=\"{{ false }}\"><button data-tour=\"dp-primary\" sc-camel-on-click=\"{{ dp.primaryGo }}\" style=\"padding:10px 16px;background:#0b2545;color:#fff;border:1px solid #0b2545;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\" style-hover=\"background:#13336f\">{{ dp.primaryLabel }}<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ ap.clock.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-tour=\"clock\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline\"><span style=\"font:600 13px 'Public Sans',sans-serif;color:#121c2b\">Review clock<\u002Fspan><span style=\"font:500 13px 'Public Sans',sans-serif;color:{{ ap.clock.fg }}\">{{ ap.clock.headline }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:2px;height:14px;width:100%\"><sc-for list=\"{{ ap.clock.segs }}\" as=\"s\" hint-placeholder-count=\"3\"><span title=\"{{ s.title }}\" style=\"flex:0 0 {{ s.w }}%;min-width:0;background:{{ s.bg }};background-image:{{ s.img }};border:1px solid {{ s.bd }}\"><\u002Fspan><\u002F
