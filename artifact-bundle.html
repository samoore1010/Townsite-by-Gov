span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">{{ e.who }}<\u002Fspan><\u002Fdiv><\u002Fli><\u002Fsc-for><\u002Fol><sc-if value=\"{{ ap.noEvents }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:16px;font:400 14px 'Public Sans',sans-serif;color:#5b6472\">No activity recorded for this approval.<\u002Fp><\u002Fsc-if><\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #d6d3c8;background:#fff\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:14px clamp(14px,3vw,28px);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;font:400 12px/1.5 'Public Sans',sans-serif;color:#5b6472\">\n    <span>Illustrative workflow. Not a legal or permitting determination. Not affiliated with any government. City, county, utility, companies, people, and project data are fictional; state agencies are named for illustration only.<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace\">schema 4 · record rev {{ revision }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<!-- DRAWER -->\n<sc-if value=\"{{ drawer.open }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;background:rgba(11,20,35,.45);z-index:40;opacity:{{ fx.drawer.o }};transition:opacity .22s ease\"><\u002Fdiv>\n  <div ref=\"{{ drawerRef }}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawer-title\" sc-camel-tab-index=\"-1\" style=\"position:fixed;top:{{ drawer.top }};right:0;bottom:0;left:{{ drawer.left }};width:{{ drawer.width }};background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.18);outline:none;opacity:{{ fx.drawer.o }};transform:{{ fx.drawer.tf }};transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .22s ease\">\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #121c2b;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n        <span style=\"font:600 11px/1.3 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#5b6472\">{{ drawer.eyebrow }}<\u002Fspan>\n        <h2 id=\"drawer-title\" style=\"margin:0;font:800 21px/1.2 'Public Sans',sans-serif;color:#0b2545\">{{ drawer.title }}<\u002Fh2>\n        <sc-if value=\"{{ drawer.hasSt }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:2px 7px;font:600 12px/18px 'Public Sans',sans-serif;white-space:nowrap;color:{{ drawer.st.fg }};background:{{ drawer.st.bg }};border:1px solid {{ drawer.st.bd }}\"><span style=\"width:7px;height:7px;background:{{ drawer.st.fg }}\"><\u002Fspan>{{ drawer.st.label }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeDrawer }}\" aria-label=\"Close panel\" style=\"flex:0 0 auto;width:36px;height:36px;background:#fff;border:1px solid #8f96a0;border-radius:2px;font:400 20px/1 'Public Sans',sans-serif;cursor:pointer\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px;font:400 14px/1.5 'Public Sans',sans-serif;color:#26313f\">\n\n      <sc-if value=\"{{ drawer.isPeek }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">WHAT THIS IS<\u002Fspan><p style=\"margin:0;font:400 15px/1.5 'Public Sans',sans-serif;color:#121c2b;text-wrap:pretty\">{{ pk.plain }}<\u002Fp><\u002Fdiv>\n        <dl style=\"margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px\"><dt style=\"color:#5b6472\">Held by<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ pk.holder }} <span style=\"font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:3px 5px;background:{{ pk.tier.bg }};color:{{ pk.tier.fg }};border:1px solid {{ pk.tier.bd }}\">{{ pk.tier.label }}<\u002Fspan><\u002Fdd><dt style=\"color:#5b6472\">Stage<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ pk.stage }}<\u002Fdd><dt style=\"color:#5b6472\">Lifecycle<\u002Fdt><dd style=\"margin:0;font-weight:600;color:{{ pk.life.fg }}\">{{ pk.life.label }}<\u002Fdd><dt style=\"color:#5b6472\">Record source<\u002Fdt><dd style=\"margin:0;font-weight:600;color:{{ pk.ev.fg }}\">{{ pk.ev.label }} <span style=\"font-weight:400;color:#5b6472\">· {{ pk.ev.source }}<\u002Fspan><\u002Fdd><sc-if value=\"{{ pk.hasRestart }}\" hint-placeholder-val=\"{{ false }}\"><dt style=\"color:#5b6472\">Staff assessment<\u002Fdt><dd style=\"margin:0\"><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:4px 6px;background:{{ pk.restart.bg }};color:{{ pk.restart.fg }};border:1px solid {{ pk.restart.bd }}\">{{ pk.restart.label }}<\u002Fspan><\u002Fdd><\u002Fsc-if><\u002Fdl>\n        <sc-if value=\"{{ pk.blocked.has }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:12px;background:#fbf2d8;border:1px solid #e5cf8e\"><svg aria-hidden=\"true\" width=\"14\" height=\"16\" sc-camel-view-box=\"0 0 16 18\" style=\"margin-top:2px\"><rect x=\"1\" y=\"7\" width=\"14\" height=\"10\" fill=\"#7a5200\"><\u002Frect><path d=\"M4 7V5a4 4 0 0 1 8 0v2\" fill=\"none\" stroke=\"#7a5200\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><span><strong style=\"color:#5c3e00\">Blocked by gate.<\u002Fstrong> Requires <button sc-camel-on-click=\"{{ pk.blocked.open }}\" style=\"background:none;border:0;padding:0;font:600 14px 'Public Sans',sans-serif;color:#1d4fb8;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ pk.blocked.label }}<\u002Fbutton>. {{ pk.blocked.rule }} <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:#5b6472\">{{ pk.blocked.cite }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ pk.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:10px 12px;background:#f1eee5;border:1px solid #cdc7b6\">{{ pk.note }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ pk.locked }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:10px 12px;background:#e7eefb;border:1px solid #b4c7ef;color:#13336f\">Shared status only. Detail held by {{ pk.holder }}.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ pk.canOpen }}\" hint-placeholder-val=\"{{ true }}\"><button data-tour=\"open-approval\" sc-camel-on-click=\"{{ pk.openApproval }}\" style=\"align-self:flex-start;padding:10px 16px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#163d8f\">Open approval →<\u002Fbutton><\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isResponse }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">One resubmittal package answers every comment in {{ rv.crId }}. It is routed to {{ rv.routed }}. Current documents stay in version history, and the review clock resumes on receipt.<\u002Fp>\n        <div><h3 style=\"margin:0 0 6px;font:700 15px 'Public Sans',sans-serif;color:#121c2b\">Included records<\u002Fh3><div style=\"border:1px solid #d6d3c8\"><sc-for list=\"{{ rv.docs }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid #e4e1d8\"><span style=\"font-weight:600\">{{ x.title }} <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:#5b6472\">{{ x.code }}<\u002Fspan><\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono',monospace\">{{ x.change }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <div><h3 style=\"margin:0 0 6px;font:700 15px 'Public Sans',sans-serif;color:#121c2b\">Answers {{ rv.count }} comments<\u002Fh3><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ rv.refs }}\" as=\"r\" hint-placeholder-count=\"5\"><span style=\"padding:3px 7px;border:1px solid #8f96a0;font:600 12px 'IBM Plex Mono',monospace\">{{ r }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <label for=\"response-text\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Response narrative<\u002Flabel>\n        <textarea id=\"response-text\" rows=\"6\" value=\"{{ rv.text }}\" sc-camel-on-change=\"{{ rv.onText }}\" maxlength=\"1800\" style=\"width:100%;padding:8px 10px;border:1px solid #8f96a0;border-radius:2px;font:400 14px/1.45 'Public Sans',sans-serif;resize:vertical\"><\u002Ftextarea>\n        <p style=\"margin:0;padding:10px 12px;background:#f1eee5;border:1px solid #cdc7b6;font-size:13px\">Demo only: creates sample versions and review events. No files are uploaded and nothing is sent to an agency.<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button data-tour=\"response-submit\" sc-camel-on-click=\"{{ submitResponse }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Submit {{ rv.next }}<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isRecommend }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">Your discipline’s recommendation on <strong>{{ rc.aid }}<\u002Fstrong> against submittal <strong>{{ rc.rev }}<\u002Fstrong>. The case manager records the approval decision once every discipline has recommended.<\u002Fp>\n        <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px\"><legend style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b;margin-bottom:8px\">Recommendation<\u002Flegend><sc-for list=\"{{ rc.options }}\" as=\"o\" hint-placeholder-count=\"2\"><label style=\"display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer\"><input type=\"radio\" name=\"rec\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.pick }}\" style=\"margin-top:3px\"><span><strong style=\"display:block;color:#121c2b\">{{ o.label }}<\u002Fstrong><span style=\"font-size:13px;color:#5b6472\">{{ o.sub }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for><\u002Ffieldset>\n        <label for=\"rec-note\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Note <span style=\"font-weight:400;color:#5b6472\">(optional)<\u002Fspan><\u002Flabel>\n        <textarea id=\"rec-note\" rows=\"3\" value=\"{{ rc.note }}\" sc-camel-on-change=\"{{ rc.onNote }}\" style=\"width:100%;padding:8px 10px;border:1px solid #8f96a0;border-radius:2px;font:400 14px/1.45 'Public Sans',sans-serif;resize:vertical\"><\u002Ftextarea>\n        <label style=\"display:flex;gap:10px;align-items:flex-start;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ rc.confirm }}\" sc-camel-on-change=\"{{ rc.onConfirm }}\" style=\"margin-top:3px;width:18px;height:18px\"><span>I reviewed the identified sample submittal and am recording this fictional recommendation within my discipline’s scope.<\u002Fspan><\u002Flabel>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button data-tour=\"recommend-form\" sc-camel-on-click=\"{{ rc.submit }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Record recommendation<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isDecision }}\" hint-placeholder-val=\"{{ false }}\">\n        <dl style=\"margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #d6d3c8\"><div style=\"padding:9px 12px;border-right:1px solid #e4e1d8\"><dt style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">DECIDED BY<\u002Fdt><dd style=\"margin:4px 0 0;font-weight:600;color:#121c2b\">{{ de.by }}<\u002Fdd><\u002Fdiv><div style=\"padding:9px 12px\"><dt style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">SUBMITTAL REVIEWED<\u002Fdt><dd style=\"margin:4px 0 0;font:600 14px 'IBM Plex Mono',monospace;color:#121c2b\">{{ de.rev }}<\u002Fdd><\u002Fdiv><\u002Fdl>\n        <p style=\"margin:0\">This decision applies to <strong>{{ de.scope }}<\u002Fstrong> only. It does not close other requirements or authorize construction.<\u002Fp>\n        <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px\"><legend style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b;margin-bottom:8px\">Disposition<\u002Flegend><sc-for list=\"{{ de.options }}\" as=\"o\" hint-placeholder-count=\"3\"><label style=\"display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer\"><input type=\"radio\" name=\"outcome\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.pick }}\" style=\"margin-top:3px\"><span><strong style=\"display:block;color:#121c2b\">{{ o.label }}<\u002Fstrong><span style=\"font-size:13px;color:#5b6472\">{{ o.sub }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for><\u002Ffieldset>\n        <label for=\"decision-conditions\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Conditions <span style=\"font-weight:400;color:#5b6472\">(one per line)<\u002Fspan><\u002Flabel>\n        <textarea id=\"decision-conditions\" rows=\"4\" value=\"{{ de.conditions }}\" sc-camel-on-change=\"{{ de.onConditions }}\" maxlength=\"1800\" style=\"width:100%;padding:8px 10px;border:1px solid #8f96a0;border-radius:2px;font:400 14px/1.45 'Public Sans',sans-serif;resize:vertical\"><\u002Ftextarea>\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Expiration<\u002Fspan><span style=\"color:#3a4553\">{{ de.expires }}<\u002Fspan><\u002Fdiv>\n        <label style=\"display:flex;gap:10px;align-items:flex-start;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ de.confirm }}\" sc-camel-on-change=\"{{ de.onConfirm }}\" style=\"margin-top:3px;width:18px;height:18px\"><span>I reviewed the identified sample submittal and every discipline’s recommendation, and am recording this fictional decision.<\u002Fspan><\u002Flabel>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button data-tour=\"decision-form\" sc-camel-on-click=\"{{ recordDecision }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Record decision<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isAgency }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">{{ agf.intro }}<\u002Fp>\n        <label for=\"agency-doc\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Document title<\u002Flabel>\n        <input id=\"agency-doc\" type=\"text\" value=\"{{ agf.title }}\" sc-camel-on-change=\"{{ agf.onTitle }}\" style=\"padding:9px 12px;border:1px solid #8f96a0;border-radius:2px;font:400 14px 'Public Sans',sans-serif\">\n        <label for=\"agency-date\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Decision date<\u002Flabel>\n        <input id=\"agency-date\" type=\"date\" value=\"{{ agf.date }}\" sc-camel-on-change=\"{{ agf.onDate }}\" style=\"padding:9px 12px;border:1px solid #8f96a0;border-radius:2px;font:400 14px 'Public Sans',sans-serif;max-width:220px\">\n        <p style=\"margin:0;padding:10px 12px;background:#f1eee5;border:1px solid #cdc7b6;font-size:13px\">Demo only. No file is uploaded. The case manager verifies the document before the status becomes Verified.<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ agf.submit }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">{{ agf.cta }}<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n            <div role=\"group\" aria-label=\"Meeting type\" style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">1 · MEETING<\u002Fspan><sc-for list=\"{{ sch.types }}\" as=\"t\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"text-align:left;padding:10px 12px;background:{{ t.bg }};border:1px solid {{ t.bd }};border-radius:2px;cursor: olid #e4e1d8;background:{{ p.bg }}\"><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><strong style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">{{ p.name }}<\u002Fstrong><span style=\"font:400 12px/1.35 'Public Sans',sans-serif;color:#3a4553\">{{ p.title }}<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:6px;align-items:center;flex:0 0 auto\"><span style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:4px 6px;border:1px solid #121c2b;background:{{ p.tagBg }};color:{{ p.tagFg }}\">{{ p.tag }}<\u002Fspan><sc-if value=\"{{ p.isOpt }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ p.toggle }}\" style=\"padding:7px 12px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer\">{{ p.toggleLabel }}<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">4 · DATE AND TIME<\u002Fspan>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><button sc-camel-on-click=\"{{ sch.prevWeek }}\" aria-label=\"Previous week\" style=\"width:34px;height:32px;background:{{ sch.prevBg }};border:1px solid #8f96a0;border-radius:2px;cursor:pointer;font:600 15px 'Public Sans',sans-serif\">‹<\u002Fbutton><strong style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Week of {{ sch.weekLabel }}<\u002Fstrong><button sc-camel-on-click=\"{{ sch.nextWeek }}\" aria-label=\"Next week\" style=\"width:34px;height:32px;background:#fff;border:1px solid #8f96a0;border-radius:2px;cursor:pointer;font:600 15px 'Public Sans',sans-serif\">›<\u002Fbutton><\u002Fdiv>\n              <div style=\"overflow-x:auto\">< px solid {{ sch.submitBg }};border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Request meeting<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isAssemble }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">Draft comments from every discipline on <strong>SPR-13 R2<\u002Fstrong>, grouped by discipline and sheet. Include or leave out each one, then issue the single comprehensive request. Drafts are Staff only until issued; issuing changes them to Team &amp; staff and notifies the applicant.<\u002Fp>\n        <sc-for list=\"{{ asm.groups }}\" as=\"g\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">{{ g.label }}<\u002Fspan><sc-for list=\"{{ g.rows }}\" as=\"x\" hint-placeholder-count=\"1\"><label style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid {{ x.bd }};background:{{ x.bg }};cursor:pointer\"><input type=\"checkbox\" checked=\"{{ x.on }}\" sc-camel-on-change=\"{{ x.toggle }}\" style=\"margin-top:3px;width:16px;height:16px\"><span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\"><strong style=\"font:700 13px 'IBM Plex Mono',monospace;color:#121c2b\">{{ x.ref }}<\u002Fstrong><span style=\"font:500 12px 'Public Sans',sans-serif;color:#5b6472\">sheet {{ x.sheet }} · {{ x.vis }}<\u002Fspan><\u002Fspan><span style=\"font:400 13px/1.45 'Public Sans',sans-serif;color:{{ x.fg }};text-wrap:pretty\">{{ x.text }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n        <div style=\"padding:12px 14px;background:#fbf2d8;border:1px solid #e5cf8e;display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#7a5200\">COORDINATED ISSUE DETECTED<\u002Fspan><span style=\"font:400 14px/1.5 'Public Sans',sans-serif;color:#3a2e10;text-wrap:pretty\">E-03 (Engineering, C-03) and F-02 (Fire, SP-01) both affect the east access drive. Flagging them as CO-01 tells the applicant to fix it once; Engineering and Fire still verify separately.<\u002Fspan><label style=\"display:flex;gap:10px;align-items:center;cursor:pointer;font:600 14px 'Public Sans',sans-serif;color:#121c2b\"><input type=\"checkbox\" checked=\"{{ asm.coord }}\" sc-camel-on-change=\"{{ asm.onCoord }}\" style=\"width:18px;height:18px\">Flag as coordinated issue CO-01 · owner: applicant’s civil engineer (named on C-03) · participants: Engineering, Fire<\u002Flabel><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">BEFORE YOU ISSUE<\u002Fspan><ol style=\"list-style:none;margin:0;padding:0;border:1px solid #d6d3c8\"><sc-for list=\"{{ asm.checks }}\" as=\"c\" hint-placeholder-count=\"4\"><li style=\"display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-bottom:1px solid #e4e1d8;font:400 13px/1.45 'Public Sans',sans-serif;color:#26313f\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;margin-top:2px;background:#0b2545;display:grid;place-items:center;color:#fff;font:800 9px/1 'Public Sans',sans-serif\">✓<\u002Fspan><span style=\"text-wrap:pretty\">{{ c }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdiv>\n        <p style=\"margin:0;padding:10px 12px;background:#f1eee5;border:1px solid #cdc7b6;font-size:13px\">Visible to: assigned city staff only until issued. Demo only: nothing is sent outside this page.<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center\"><span style=\"font:600 13px 'Public Sans',sans-serif;color:#3a4553\">{{ asm.summary }}<\u002Fspan><div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button data-tour=\"cr-issue\" sc-camel-on-click=\"{{ asm.issue }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Issue correction request<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isAssess }}\" hint-placeholder-val=\"{{ false }}\">\n        <dl style=\"margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px\"><dt style=\"color:#5b6472\">Prior approval<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ asx.prior }}<\u002Fdd><dt style=\"color:#5b6472\">Record source<\u002Fdt><dd style=\"margin:0;font-weight:600;color:{{ asx.ev.fg }}\">{{ asx.ev.label }}<\u002Fdd><dt style=\"color:#5b6472\">Lifecycle<\u002Fdt><dd style=\"margin:0;font-weight:600;color:{{ asx.life.fg }}\">{{ asx.life.label }}<\u002Fdd><\u002Fdl>\n        <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:6px\"><legend style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b;margin-bottom:8px\">How does it apply to the current application?<\u002Flegend><sc-for list=\"{{ asx.options }}\" as=\"o\" hint-placeholder-count=\"6\"><label style=\"display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer\"><input type=\"radio\" name=\"assess\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.pick }}\" style=\"margin-top:3px\"><span><strong style=\"display:block;color:#121c2b\">{{ o.label }}<\u002Fstrong><span style=\"font-size:13px;color:#5b6472\">{{ o.sub }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for><\u002Ffieldset>\n        <label for=\"assess-basis\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Basis <span style=\"font-weight:400;color:#5b6472\">(code section or reason · required)<\u002Fspan><\u002Flabel>\n        <textarea id=\"assess-basis\" rows=\"3\" value=\"{{ asx.basis }}\" sc-camel-on-change=\"{{ asx.onBasis }}\" maxlength=\"600\" style=\"width:100%;padding:8px 10px;border:1px solid #8f96a0;border-radius:2px;font:400 14px/1.45 'Public Sans',sans-serif;resize:vertical\"><\u002Ftextarea>\n        <p style=\"margin:0;padding:10px 12px;background:#fbf2d8;border:1px solid #e5cf8e;font:500 13px/1.5 'Public Sans',sans-serif;color:#5c3e00\">Staff assessment · preliminary and non-binding. Final determinations are made in the decision on each application or by formal interpretation. Visible to: project team &amp; staff.<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center\"><button sc-camel-on-click=\"{{ asx.route }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Route to formal determination<\u002Fbutton><div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ asx.submit }}\" style=\"padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Record assessment<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isLayers }}\" hint-placeholder-val=\"{{ false }}\">\n        <ol style=\"list-style:none;margin:0;padding:0;border:1px solid #d6d3c8\"><sc-for list=\"{{ lmap.legend }}\" as=\"l\" hint-placeholder-count=\"5\"><li><button sc-camel-on-click=\"{{ l.toggle }}\" aria-pressed=\"{{ l.pressed }}\" style=\"width:100%;display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;background:none;border:0;border-bottom:1px solid #e4e1d8;text-align:left;cursor:pointer;opacity:{{ l.opacity }}\"><span aria-hidden=\"true\" style=\"width:14px;height:14px;margin-top:2px;background:{{ l.swBg }};border:{{ l.swW }} {{ l.swStyle }} {{ l.swBd }};border-radius:{{ l.swR }}\"><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font:600 14px 'Public Sans',sans-serif;color:#121c2b\">{{ l.n }} · {{ l.name }} · {{ l.vis.name }}<\u002Fstrong><span style=\"font:400 12px/1.4 'Public Sans',sans-serif;color:#5b6472\">{{ l.source }} · {{ l.date }}<\u002Fspan><\u002Fspan><\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Fol>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Done<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isReturn }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">Return the uploaded document to the applicant with a note. The requirement goes back to <strong>Not on file<\u002Fstrong> until a corrected upload arrives.<\u002Fp>\n        <label for=\"return-note\" style=\"font:700 14px 'Public Sans',sans-serif;color:#121c2b\">Note to applicant<\u002Flabel>\n        <textarea id=\"return-note\" rows=\"3\" value=\"{{ rtn.note }}\" sc-camel-on-change=\"{{ rtn.onNote }}\" maxlength=\"600\" style=\"width:100%;padding:8px 10px;border:1px solid #8f96a0;border-radius:2px;font:400 14px/1.45 'Public Sans',sans-serif;resize:vertical\"><\u002Ftextarea>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ rtn.submit }}\" style=\"padding:9px 14px;background:#a3431a;color:#fff;border:1px solid #a3431a;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\">Return to applicant<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isMenu }}\" hint-placeholder-val=\"{{ false }}\">\n        <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px\"><sc-for list=\"{{ gnav }}\" as=\"n\" hint-placeholder-count=\"3\"><li><button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"width:100%;text-align:left;padding:12px 10px;background:#fff;color:#121c2b;border:0;border-bottom:1px solid #e4e1d8;font:600 15px 'Public Sans',sans-serif;cursor:pointer\">{{ n.label }}<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Fol>\n        <div style=\"display:flex;flex-direction:column;gap:4px;font:400 13px/1.4 'Public Sans',sans-serif;color:#3a4553\"><strong style=\"color:#121c2b\">{{ me.person }}<\u002Fstrong><span>{{ me.org }}<\u002Fspan><span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">{{ saveText }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><button sc-camel-on-click=\"{{ tourToggle }}\" style=\"padding:9px 14px;background:#121c2b;color:#fff;border:1px solid #121c2b;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">{{ tourBtn }}<\u002Fbutton><button sc-camel-on-click=\"{{ openAbout }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">About<\u002Fbutton><button sc-camel-on-click=\"{{ askReset }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Reset<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isSections }}\" hint-placeholder-val=\"{{ false }}\">\n        <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px\"><sc-for list=\"{{ rail }}\" as=\"r\" hint-placeholder-count=\"9\"><li><button sc-camel-on-click=\"{{ r.go }}\" aria-current=\"{{ r.current }}\" style=\"width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 10px;background:{{ r.bg }};color:{{ r.fg }};border:0;border-left:3px solid {{ r.bar }};text-align:left;font:600 15px 'Public Sans',sans-serif;cursor:pointer\"><span aria-hidden=\"true\" style=\"font:500 15px/1 'IBM Plex Mono',monospace;color:{{ r.abbrFg }};text-align:center\">{{ r.glyph }}<\u002Fspan><span>{{ r.label }}<\u002Fspan><sc-if value=\"{{ r.hasCount }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;padding:3px 5px;background:{{ r.countBg }};color:{{ r.countFg }}\">{{ r.count }}<\u002Fspan><\u002Fsc-if><\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Fol>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isReset }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">This replaces the saved demonstration state, including responses, verifications, recommendations, decisions, and meeting requests, with the original record.<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"padding:9px 14px;background:#fff;color:#121c2b;border:1px solid #8f96a0;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Keep exploring<\u002Fbutton><button sc-camel-on-click=\"{{ confirmReset }}\" style=\"padding:9px 14px;background:#a3221a;color:#fff;border:1px solid #a3221a;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Reset demo<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ drawer.isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0\">CivicPath is the city’s system of record for every development approval, from pre-application to certificate of occupancy. It shows only what the city can know: city actions as authoritative record, filings as filed, outside decisions once uploaded and verified, and nothing about private business facts. This demonstration follows Saguaro Commons, a project with prior approvals on its parcel, through seven personas.<\u002Fp>\n        <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px\">\n          <li><strong>Resident.<\u002Fstrong> Factual status, approvals on the parcel, public documents only.<\u002Fli>\n          <li><strong>Reviewers.<\u002Fstrong> Draft comments, Staff only, on sheets C-03 and SP-01.<\u002Fli>\n          <li><strong>Case manager.<\u002Fstrong> Assemble and issue the one comprehensive correction request; record non-binding staff assessments; verify an uploaded outside decision.<\u002Fli>\n          <li><strong>Applicant.<\u002Fstrong> Request a correction meeting (city must meet within 10 working days of the request), keep a private team checklist, submit one coordinated response.<\u002Fli>\n          <li><strong>City manager.<\u002Fstrong> Time frames, correction requests per application, refund exposure, inactive applications with observable reasons only.<\u002Fli>\n        <\u002Fol>\n        <p style=\"margin:0;padding:10px 12px;background:#f1eee5;border:1px solid #cdc7b6\">City of Cholla Ridge, Mesquite County, Cholla Ridge Water Company, all companies, people, addresses, parcels, ordinances, and project data are fictional. State agencies appear by name for illustration only and do not use or endorse CivicPath. Fees and time frames are samples. Persona switching illustrates the experience, not authentication. The assistant is simulated.<\u002Fp>\n        <button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"align-self:flex-start;padding:9px 14px;background:#1d4fb8;color:#fff;border:1px solid #1d4fb8;border-radius:2px;font:600 14px 'Public Sans',sans-serif;cursor:pointer\">Explore<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- TOUR -->\n<sc-if value=\"{{ tour.on }}\" hint-placeholder-val=\"{{ false }}\">\n  <div aria-hidden=\"true\" style=\"position:fixed;inset:0;z-index:70;pointer-events:none\">\n    <sc-if value=\"{{ tour.hasSpot }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;left:{{ tour.sx }}px;top:{{ tour.sy }}px;width:{{ tour.sw }}px;height:{{ tour.sh }}px;border:2px solid #f2b631;border-radius:3px;box-shadow:0 0 0 9999px rgba(8,16,30,.56);transition:left .4s cubic-bezier(.2,.8,.2,1), top .4s cubic-bezier(.2,.8,.2,1), width .4s cubic-bezier(.2,.8,.2,1), height .4s cubic-bezier(.2,.8,.2,1)\">{{ tour.pulse }}<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ tour.isCenter }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;inset:0;background:rgba(8,16,30,.62)\"><\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div role=\"dialog\" aria-modal=\"false\" aria-labelledby=\"tour-title\" style=\"position:fixed;left:{{ tour.px }}px;top:{{ tour.py }}px;width:{{ tour.pw }}px;z-index:72;background:#fff;border:1px solid #121c2b;box-shadow:0 18px 48px rgba(0,0,0,.32);transition:left .4s cubic-bezier(.2,.8,.2,1), top .4s cubic-bezier(.2,.8,.2,1)\">\n    <div style=\"height:4px;background:#e4e1d8\"><div style=\"height:100%;width:{{ tour.pct }}%;background:#f2b631;transition:width .4s ease\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\"><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#7a5200\">{{ tour.kicker }}<\u002Fspan><span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#5b6472\">{{ tour.count }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ tour.hasRole }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:12px;align-items:center;padding:10px 12px;background:#0b2545;color:#fff\"><span style=\"width:38px;height:38px;background:#f2b631;color:#0b2545;display:grid;place-items:center;font:800 14px 'Public Sans',sans-serif\">{{ tour.roleInitials }}<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:3px\"><strong style=\"font:700 15px 'Public Sans',sans-serif\">{{ tour.rolePerson }}<\u002Fstrong><span style=\"font:400 12px 'Public Sans',sans-serif;color:#c3cfe0\">{{ tour.roleOrg }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <h2 id=\"tour-title\" style=\"margin:0;font:800 20px/1.22 'Public Sans',sans-serif;color:#0b2545;text-wrap:balance\">{{ tour.title }}<\u002Fh2>\n      <p style=\"margin:0;font:400 15px/1.55 'Public Sans',sans-serif;color:#26313f;text-wrap:pretty\">{{ tour.body }}<\u002Fp>\n      <sc-if value=\"{{ tour.isAction }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 11px;background:#fbf2d8;border:1px solid #e5cf8e\"><span style=\"display:flex;gap:8px;align-items:center;font:600 13px 'Public Sans',sans-serif;color:#5c3e00\">{{ tour.dot }}Action required: use the highlighted control<\u002Fspan><sc-if value=\"{{ tour.canAuto }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ tour.auto }}\" style=\"background:none;border:0;padding:0;font:600 13px 'Public Sans',sans-serif;color:#5c3e00;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap\">Do it for me<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:14px\"><sc-if value=\"{{ tour.canBack }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ tour.back }}\" style=\"background:none;border:0;padding:0;font:600 13px 'Public Sans',sans-serif;color:#121c2b;cursor:pointer\">← Back<\u002Fbutton><\u002Fsc-if><button sc-camel-on-click=\"{{ tour.skip }}\" style=\"background:none;border:0;padding:0;font:600 13px 'Public Sans',sans-serif;color:#5b6472;cursor:pointer;text-decoration:underline;text-underline-offset:3px\">{{ tour.skipLabel }}<\u002Fbutton><\u002Fdiv>\n        <sc-if value=\"{{ tour.showNext }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ tour.next }}\" style=\"padding:10px 16px;background:#0b2545;color:#fff;border:0;border-radius:2px;font:700 14px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap\" style-hover=\"background:#163d8f\">{{ tour.nextLabel }} →<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- BOOT -->\n<sc-if value=\"{{ boot.show }}\" hint-placeholder-val=\"{{ true }}\">\n  <div role=\"status\" aria-live=\"polite\" style=\"position:fixed;inset:0;z-index:90;background:#f3f2ee;display:grid;place-items:center;opacity:{{ boot.o }};transition:opacity .4s ease\">\n    <div style=\"width:min(380px,86vw);display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:38px;height:38px;border:2px solid #0b2545;display:grid;place-items:center;font:700 14px/1 'IBM Plex Mono',monospace;color:#0b2545\">CP<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font:800 20px/1 'Public Sans',sans-serif;color:#0b2545\">CivicPath<\u002Fstrong><span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5b6472\">CITY OF CHOLLA RIDGE · SYSTEM OF RECORD<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"height:4px;background:#e0ddd3\"><div style=\"height:100%;width:{{ boot.pct }}%;background:#0b2545;transition:width .35s ease\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\"><sc-for list=\"{{ boot.rows }}\" as=\"b\" hint-placeholder-count=\"3\"><div style=\"display:flex;gap:12px;align-items:center;font:500 14px 'Public Sans',sans-serif;color:{{ b.fg }};transition:color .2s\"><span style=\"width:14px;display:grid;place-items:center\">{{ b.icon }}<\u002Fspan>{{ b.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div role=\"status\" aria-live=\"polite\" style=\"position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;pointer-events:none\">\n  <div style=\"max-width:min(560px,92vw);padding:11px 16px;background:#121c2b;color:#fff;font:500 14px/1.4 'Public Sans',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:{{ fx.toast.o }};transform:translateY({{ fx.toast.y }});transition:opacity .25s ease, transform .3s cubic-bezier(.2,.8,.2,1)\">{{ fx.toast.text }}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showGuide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Offer guided tour on first visit&quot;},&quot;loadingScreen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;,&quot;label&quot;:&quot;Show loading screen&quot;}}\">\nconst KEY='civicpath-cholla-v4';\nconst TODAY=new Date(2026,9,1);\nconst DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst isoD=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');\nconst parseIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};\nconst fmtShort=s=>{const x=typeof s==='string'?parseIso(s):s;return MON[x.getMonth()]+' '+x.getDate();};\nconst fmtLong=s=>{const x=typeof s==='string'?parseIso(s):s;return DAYN[x.getDay()]+', '+MON[x.getMonth()]+' '+x.getDate()+', '+x.getFullYear();};\nconst fmtMDY=s=>{const x=typeof s==='string'?parseIso(s):s;return MON[x.getMonth()]+' '+x.getDate()+', '+x.getFullYear();};\nconst tlabel=m=>{const hh=Math.floor(m/60),mm=m%60;return ((hh+11)%12+1)+':'+String(mm).padStart(2,'0')+' '+(hh<12?'AM':'PM');};\nconst hashf=s=>{let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return (x>>>0)/4294967295;};\nconst money=n=>'$'+n.toLocaleString('en-US');\nconst clone=o=>JSON.parse(JSON.stringify(o));\nconst daysBetween=(a,b)=>Math.round((parseIso(b)-parseIso(a))/86400000);\nconst addDays=(s,n)=>{const x=parseIso(s);x.setDate(x.getDate()+n);return isoD(x);};\nconst addWD=(s,n)=>{const x=typeof s==='string'?parseIso(s):new Date(s);let k=0;while(k<n){x.setDate(x.getDate()+1);if(x.getDay()>0&&x.getDay()<6)k++;}return isoD(x);};\nconst wdBetween=(a,b)=>{const x=parseIso(a),e=parseIso(b);let k=0;while(x<e){x.setDate(x.getDate()+1);if(x.getDay()>0&&x.getDay()<6)k++;}return k;};\nconst nowStamp=()=>MON[TODAY.getMonth()]+' '+String(TODAY.getDate()).padStart(2,'0')+' · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});\n\nconst PERSONAS={\n resident:{name:'Resident',person:'Resident',org:'Public view · no sign-in',initials:'R',home:'pubHome',abg:'#c3cfe0'},\n applicant:{name:'Applicant',person:'Dana Whitfield',org:'Development Manager · Ridgeline Residential LLC',initials:'DW',home:'myProjects',abg:'#f2b631'},\n planning:{name:'Case manager',person:'Alex Morgan',org:'Senior Planner · Planning & Zoning Division',initials:'AM',home:'myWork',staff:true,disc:'planning',abg:'#f2b631'},\n engineering:{name:'Engineering reviewer',person:'Taylor Chen',org:'Development Engineer · Engineering / Public Works',initials:'TC',home:'myWork',staff:true,disc:'engineering',abg:'#f2b631'},\n fire:{name:'Fire reviewer',person:'Casey Rivera',org:'Deputy Fire Marshal · Fire Department',initials:'CR'  a rezoning, or a Planned Area Development. These are legislative decisions: neighbors are notified, the Planning & Zoning Commission holds a hearing and recommends, and the City Council adopts by ordinance. A PAD, once adopted, does not expire. Where a code question needs a binding answer, the Zoning Administrator issues a written, appealable interpretation.',terms:['PAD','Prop. 207 waiver','Zoning interpretation']},\n {n:2,name:'Water',short:'Water',ends:'an assured water supply is demonstrated',line:'Assured water supply, CAGRD activation, line-extension agreement.',plain:'Inside an Active Management Area, no subdivision can get a final plat and no lot or unit can be sold without a 100-year assured water supply. Either ADWR issues a certificate, or a designated provider gives a written commitment of service. CAGRD member-land activation and a line-extension agreement with the water utility go alongside.',terms:['Assured water supply','CAGRD']},\n {n:3,name:'Site plan',short:'Site plan',ends:'the site plan is approved',line:'Site plan, landscape, utilities, photometrics, elevations; traffic and drainage reports as components.',plain:'An administrative, staff-level review of the layout: buildings, parking, access, landscape, utilities, lighting, and elevations, with traffic and drainage reports reviewed as components of the same submittal. Planning, Engineering, Fire, Wastewater, and the water utility all review. During substantive review the city may issue one comprehensive request for corrections per application.',terms:['Site plan','Correction request']},\n {n:4,name:'Plat',short:'Plat',ends:'the final plat is recorded',line:'Preliminary plat, final plat, condominium declaration, assurances, recording.',plain:'The plat is the map that legally divides the land into lots or units. The Commission approves the preliminary plat; staff reviews and Council accepts the final plat; improvement assurances are posted; the County Recorder records it. Condominiums also record a declaration that creates the units and the owners’ association.',terms:['Preliminary / final plat','Condominium declaration']},\n {n:5,name:'Civil & site permits',short:'Civil',ends:'site work can legally begin',line:'Improvement plans, grading, ADEQ, stormwater, dust, ADOT.',plain:'Engineering approves the improvement plans for grading, drainage, paving, water, and sewer. Before any ground is disturbed, stormwater coverage from ADEQ and a dust control permit from the county must be in place, along with ADEQ’s approval to construct water and sewer facilities.',terms:['Improvement assurances','SWPPP / NOI']},\n {n:6,name:'Building',short:'Building',ends:'the certificate of occupancy issues',line:'Building permits, impact fees, inspections, certificate of occupancy.',plain:'Building Safety reviews construction documents in about 20 working days per cycle. Development and impact fees are due at permit issuance. Inspections follow in code sequence, and the certificate of occupancy is the final approval to occupy. Permits expire after 180 days without an inspection.',terms:['Certificate of occupancy (CO)']},\n {n:7,name:'Sale (state)',short:'Sale',ends:'ADRE issues the public report',line:'ADRE subdivision public report. State requirement; shown for information.',plain:'For-sale projects only. The Arizona Department of Real Estate issues a subdivision public report after the plat is recorded. Under state law, units may not be sold until it issues. The city has no role; CivicPath shows this stage for information and does not track sales.',terms:['Public report']}];\nconst GLOSS={'Pre-application meeting':'Required meeting with all city disciplines before any zoning, site plan, or plat submittal. Statements made there are non-binding.','PAD':'Planned Area Development: a custom zoning district adopted by ordinance with its own uses, density, and standards.','Prop. 207 waiver':'The owner’s waiver of diminution-in-value claims for a requested land use change (A.R.S. § 12-
