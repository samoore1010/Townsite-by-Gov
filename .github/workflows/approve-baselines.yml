name: Approve design (regenerate baselines)

# Run manually (Actions tab -> "Approve design" -> Run workflow) ONLY after the
# owner has reviewed and approved a visual change. Regenerates design.lock.json
# and tests/baselines/ in the same environment CI uses, then commits them.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to approve
        required: true
        default: main

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run design:approve
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design.lock.json tests/baselines
          git diff --cached --quiet || git commit -m "Approve design: regenerate checksums and visual baselines"
          git push
